    renderer.domElement.addEventListener('click',ev=>{if(walking){if(document.pointerLockElement!==renderer.domElement)capturePointer();return;}mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(exitObjects,true);if(!hits.length)return;let p=hits[0].object;while(p&&!p.userData.exit)p=p.parent;if(p){const e=exitsByName.get(p.userData.exit);controls.target.set(e[1]*hallScale,0,-e[2]*hallScale);}});
    document.addEventListener('mousemove',ev=>{if(!walking||document.pointerLockElement!==renderer.domElement)return;walkYaw-=ev.movementX*.0021;walkPitch=Math.max(-.72,Math.min(.55,walkPitch-ev.movementY*.0018));setWalkLook();});
    document.addEventListener('pointerlockchange',()=>{if(walking)walkHelp.innerHTML=document.pointerLockElement===renderer.domElement?'W A S D 移动 · 鼠标转向<br>方向键前后/横移 · Q / E 转向<br>Esc 解锁鼠标 · 点「第一视角」返回':'鼠标已解锁 · 点画面可重新捕获<br>W A S D 移动 · Q / E 转向<br>点「第一视角」返回模型视角';});
    document.addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(walking&&['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)){held.add(k);ev.preventDefault();}});
    document.addEventListener('keyup',ev=>held.delete(ev.key.toLowerCase()));
    window.addEventListener('blur',()=>held.clear());
    const compassNeedle=document.querySelector('.compass i');
    function updateCompass(){const offset=mapCamera.position.clone().sub(controls.target);const azimuth=Math.atan2(offset.x,offset.z),elevation=Math.atan2(offset.y,Math.hypot(offset.x,offset.z));const northX=Math.sin(azimuth),northY=Math.cos(azimuth)*Math.sin(elevation);compassNeedle.style.transform=`rotate(${Math.atan2(northX,northY)}rad)`;}
    document.querySelectorAll('.level').forEach(btn=>btn.addEventListener('click',()=>{const v=btn.dataset.level;if(v==='walk'){if(walking){leaveWalk(true);document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b.dataset.level==='b1'));}else{enterWalk();document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b===btn));}return;}if(walking)leaveWalk();document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b===btn));if(v==='b1'){level1.visible=true;level2.visible=false;controls.target.set(4,0,-8);mapCamera.position.set(75,69,95);mapCamera.zoom=1;}else if(v==='b2'){level1.visible=false;level2.visible=true;controls.target.set(0,-4.2,1);mapCamera.position.set(29,25,37);mapCamera.zoom=3.8;}else{level1.visible=true;level2.visible=true;controls.target.set(4,-2.3,-8);mapCamera.position.set(82,92,77);mapCamera.zoom=.78;}mapCamera.updateProjectionMatrix();controls.update();updateCompass();}));
    level2.visible=false;
    addEventListener('resize',()=>{const a=innerWidth/innerHeight;mapCamera.left=-cameraViewHeight*a/2;mapCamera.right=cameraViewHeight*a/2;mapCamera.top=cameraViewHeight/2;mapCamera.bottom=-cameraViewHeight/2;mapCamera.updateProjectionMatrix();walkCamera.aspect=a;walkCamera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    document.querySelectorAll('[data-focus]').forEach(btn=>btn.addEventListener('click',()=>{
      const key=btn.dataset.focus,source=stationDetails.layout.focus[key],point=[source[0],-source[1]];
      if(walking){[walkX,walkZ]=nearestWalkPoint(...point);walkYaw=Math.PI;walkPitch=0;setWalkLook();}
      else{level1.visible=true;level2.visible=false;controls.target.set(point[0],1,point[1]);mapCamera.position.set(point[0]+24,24,point[1]+29);mapCamera.zoom=key==='toilet'?5:2.7;mapCamera.updateProjectionMatrix();controls.update();}
    }));
    document.querySelector('#cutaway').addEventListener('click',ev=>{cutaway=!cutaway;ev.currentTarget.setAttribute('aria-pressed',String(cutaway));ev.currentTarget.textContent=cutaway?'剖切：开':'剖切：关';refreshDetailVisibility();});
    let perfFrames=0,perfStart=0;
    const perf=document.querySelector('#performance');
    function updatePerf(now){perfFrames++;if(now-perfStart>1000){perf.textContent=Math.round(perfFrames*1000/(now-perfStart))+' FPS · '+renderer.info.render.calls+' 绘制';perfFrames=0;perfStart=now;}}
    // Read-only diagnostics used by the local acceptance script.
    window.stationViewer={details:stationDetails,isWalkable,nearestWalkPoint,scene,renderer,get camera(){return camera;}};
    const clock=new THREE.Clock();let lastFrame=0;function animate(now){requestAnimationFrame(animate);if(now-lastFrame<15)return;lastFrame=now;const dt=Math.min(clock.getDelta(),.05);if(walking)updateWalk(dt);else{controls.update();updateCompass();}renderer.render(scene,camera);updatePerf(now,dt);}requestAnimationFrame(animate);
  </script>
</body>
</html>
