    function stairFlight(parent,x,z,width=1.45,run=3.8,rise=1.55){const g=new THREE.Group();g.position.set(x,.11,z);parent.add(g);const count=13,step=run/count;for(let i=0;i<count;i++){const h=rise*(i+1)/count,t=box(g,0,h/2,-run/2+step*(i+.5),width,h,step*.96,mat(i%2?'#c5cbc7':'#aeb8b4',.5));t.castShadow=true;}const railLen=Math.hypot(run,rise);for(const side of [-1,1]){const rail=box(g,side*(width*.58),rise/2+.62,0,.075,.08,railLen,steel);rail.rotation.x=-Math.atan2(rise,run);const postCount=5;for(let i=0;i<postCount;i++){const f=i/(postCount-1);box(g,side*(width*.58),.18+rise*f+.3,-run/2+run*f,.055,.62,.055,steel);}}box(g,0,.07,run/2+.35,width+1.15,.14,.7,mat('#bfc7c2'));return g;}
    // Paired stair/escalator bank is set in the 11A spur, leaving the main north-south route open.
    const stair11a=stairFlight(level1,4.35,18,1.4,3.7,1.65);stair11a.rotation.y=Math.PI/2;
    escalator(level1,6.8,18,Math.PI/2);
    box(level1,6.35,.25,18,.48,.18,3.15,mat('#cbd0cc'));
    label(level1,'站厅 / 换乘',0,0,{scale:1.12}); label(level1,'公共通道',-15,1,{scale:.85}); label(level1,'公共通道',17,1,{scale:.85}); label(level1,'向南换乘',-2,26,{scale:.8});

    // Apply the requested B1 hall enlargement as one consistent horizontal scale,
    // preserving every fixture's relative size and all vertical clearances.
    const hallScale=5;
    level1.scale.set(hallScale,1,hallScale);

    // B2: lower platform and tracks, positioned under the central B1 station.
    slab(level2,0,-1,24,38,-5.0,1.0,mat('#34414b'));
    slab(level2,0,-1,8,31,-4.38,.2,platformMat);
    slab(level2,-7.3,-1,3.5,31,-4.4,.18,trackMat); slab(level2,7.3,-1,3.5,31,-4.4,.18,trackMat);
    [-8.1,-6.5,6.5,8.1].forEach(x=>{box(level2,x,-4.24,-1,.11,.12,31,mat('#b6a35e'));});
    [-4.2,4.2].forEach(x=>{slab(level2,x,-1,.3,29,-4.27,.08,yellowMat);});
    for(let z=-13;z<=12;z+=5){[-2.2,2.2].forEach(x=>{const p=box(level2,x,-3.55,z,.48,1.55,.48,pillarMat);p.material=mat('#b2b8b4');});}
    for(let z=-10;z<=10;z+=10){box(level2,0,-3.95,z,2.8,.36,.7,mat('#59686e'));}
    label(level2,'站台层',0,-15,{color:'#edf4f1',bg:'#33434b',scale:1.05});
    label(level2,'轨道区',0,14,{color:'#edf4f1',bg:'#33434b',scale:.8});
    const core=box(level2,0,-2.1,-1,3.6,3.4,4.3,glassMat); core.material.side=THREE.DoubleSide;
    escalator(level2,-1.1,-1,0).position.y=-4.23; escalator(level2,1.1,-1,Math.PI).position.y=-4.23;

    // Ground plane, grid and faint survey frame.
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),mat('#0d1820'));ground.rotation.x=-Math.PI/2;ground.position.y=-5.65;ground.receiveShadow=true;scene.add(ground);
    const grid=new THREE.GridHelper(1150,115,'#29414b','#1b2b34');grid.position.y=-5.61;grid.material.transparent=true;grid.material.opacity=.27;scene.add(grid);
    // subtle corner registration marks
    const marks=new THREE.Group();scene.add(marks);
    const exitsByName=new Map(exits.map(e=>[e[0],e]));

    const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2(), tip=document.querySelector('#tip'), walkHelp=document.querySelector('#walk-help');
    let walking=false, savedView=null, walkX=0, walkZ=23.2*hallScale, walkYaw=Math.PI, walkPitch=0, dragLook=false, dragX=0, dragY=0;
    const held=new Set();
    function isWalkable(x,z){
      const u=x/hallScale,v=z/hallScale;
      const hub=(u*u)/(6.85*6.85)+(v*v)/(5.05*5.05)<=1;
      const ringOuter=(u*u)/(9.98*9.98)+(v*v)/(7.62*7.62)<=1;
      const ringInner=(u*u)/(5.65*5.65)+(v*v)/(4.35*4.35)>=1;
      const outerLane=ringOuter&&ringInner;
      const spine=Math.abs(u)<=2.26&&v>=.1&&v<=30.6;
      const westMain=u>=-31&&u<=-2.5&&v>=-.95&&v<=3.0;
      const eastMain=u>=2.5&&u<=44.8&&v>=-.95&&v<=3.0;
      const southMain=Math.abs(u)<=3.25&&v>=-20.5&&v<=.5;
      const southBend=u>=-7.8&&u<=1.0&&v>=-29&&v<=-15.5;
      const southEnd=u>=-8.0&&u<=.0&&v>=-35.5&&v<=-26;
      const west6=v>=9.4&&v<=11.7&&u>=-6.7&&u<=-1.9;
      const west7=v>=13.2&&v<=15.6&&u>=-6.7&&u<=-1.9;
      const west8=v>=20.7&&v<=23.3&&u>=-6.7&&u<=-1.9;
      const west9=v>=27.3&&v<=30.4&&u>=-5.0&&u<=-1.9;
      const restroom=v>=11.7&&v<=14.4&&u>=4.4&&u<=9.0;
      const east11b=v>=5.7&&v<=8.3&&u>=1.9&&u<=8.9;
      const east11a=v>=16.8&&v<=19.3&&u>=1.9&&u<=8.1;
      const east10=v>=26.4&&v<=29.4&&u>=1.9&&u<=8.3;
      const shopFront=v>=20.2&&v<=26.0&&u>=1.9&&u<=8.5;
      if(!(hub||outerLane||spine||westMain||eastMain||southMain||southBend||southEnd||west6||west7||west8||west9||restroom||east11b||east11a||east10||shopFront))return false;
      for(const [px,pz] of pierSpecs)if(Math.hypot(x-px*hallScale,z-pz*hallScale)<.88)return false;
      for(const [px,pz] of outerPierSpecs)if(Math.hypot(x-px*hallScale,z-pz*hallScale)<1.03)return false;
      if(Math.abs(x-6.6*hallScale)<1.6&&Math.abs(z-13*hallScale)<.7)return false;
      for(const pz of [5.5,11.2,17,22.5])for(const side of [-1,1])if(Math.abs(x-side*2.62*hallScale)<.62&&Math.abs(z-pz*hallScale)<.68)return false;
      return true;
    }
    function setWalkLook(){camera.rotation.order='YXZ';camera.rotation.set(walkPitch,walkYaw+Math.PI,0,'YXZ');}
    function nearestWalkPoint(x,z){
      if(isWalkable(x,z))return [x,z];
      const u=x/hallScale,v=z/hallScale;
      for(let r=.15;r<=50;r+=.15){const n=Math.max(12,Math.ceil(2*Math.PI*r/.15));for(let i=0;i<n;i++){const a=i*2*Math.PI/n,px=(u+Math.cos(a)*r)*hallScale,pz=(v+Math.sin(a)*r)*hallScale;if(isWalkable(px,pz))return [px,pz];}}
      return [0,23.2*hallScale];
    }
    function capturePointer(){try{const pending=renderer.domElement.requestPointerLock?.();if(pending&&pending.catch)pending.catch(()=>{});}catch(_){}}
    function enterWalk(){
      if(walking){leaveWalk(true);return;}
      const direction=new THREE.Vector3();mapCamera.getWorldDirection(direction);
      const [startX,startZ]=nearestWalkPoint(controls.target.x,controls.target.z);
      savedView={position:mapCamera.position.clone(),target:controls.target.clone(),zoom:mapCamera.zoom,level1:level1.visible,level2:level2.visible,rotationOrder:mapCamera.rotation.order,rootRotation:root.rotation.y};
      walking=true;walkX=startX;walkZ=startZ;walkYaw=Math.atan2(direction.x,direction.z);walkPitch=Math.max(-.18,Math.min(.18,Math.asin(THREE.MathUtils.clamp(direction.y,-1,1))));level1.visible=true;level2.visible=false;
      root.rotation.y=0;switchCamera(walkCamera,new THREE.Vector3(walkX,1.65,walkZ));camera.position.set(walkX,1.65,walkZ);setWalkLook();walkHelp.hidden=false;walkHelp.innerHTML='从当前地图焦点进入第一视角；切回地图会定位到当前位置<br>W A S D 移动 · 鼠标转向 · Q / E 转向<br>Esc 解锁鼠标 · 点「第一视角」返回建模视图';
      controls.enabled=false;capturePointer();
    }
    function leaveWalk(focusPlayer=false){
      const playerX=walkX,playerZ=walkZ;walking=false;held.clear();if(document.pointerLockElement===renderer.domElement&&document.exitPointerLock)document.exitPointerLock();
      if(savedView){level1.visible=focusPlayer?true:savedView.level1;level2.visible=focusPlayer?false:savedView.level2;root.rotation.y=focusPlayer?0:savedView.rootRotation;switchCamera(mapCamera,focusPlayer?new THREE.Vector3(playerX,0,playerZ):savedView.target);
        if(focusPlayer){mapCamera.position.set(playerX+95,95,playerZ+145);mapCamera.zoom=1.3;}
        else{mapCamera.position.copy(savedView.position);mapCamera.zoom=savedView.zoom;mapCamera.rotation.order=savedView.rotationOrder;}
        mapCamera.updateProjectionMatrix();savedView=null;
      }
      walkHelp.hidden=true;controls.enabled=true;controls.update();
    }
    function updateWalk(dt){
      if(held.has('q'))walkYaw+=1.5*dt;if(held.has('e'))walkYaw-=1.5*dt;
      const forwardX=Math.sin(walkYaw),forwardZ=Math.cos(walkYaw),rightX=-Math.cos(walkYaw),rightZ=Math.sin(walkYaw);
      let dx=0,dz=0;if(held.has('w')||held.has('arrowup')){dx+=forwardX;dz+=forwardZ;}if(held.has('s')||held.has('arrowdown')){dx-=forwardX;dz-=forwardZ;}
      if(held.has('d')||held.has('arrowright')){dx+=rightX;dz+=rightZ;}if(held.has('a')||held.has('arrowleft')){dx-=rightX;dz-=rightZ;}
      const mag=Math.hypot(dx,dz);if(mag){const speed=(held.has('shift')?4.2:2.65)*hallScale;dx=dx/mag*speed*dt;dz=dz/mag*speed*dt;if(isWalkable(walkX+dx,walkZ))walkX+=dx;if(isWalkable(walkX,walkZ+dz))walkZ+=dz;}
      camera.position.set(walkX,1.65,walkZ);setWalkLook();
    }
    renderer.domElement.addEventListener('pointerdown',ev=>{if(walking&&document.pointerLockElement!==renderer.domElement){dragLook=true;dragX=ev.clientX;dragY=ev.clientY;}});
    renderer.domElement.addEventListener('pointerup',()=>{dragLook=false;});
    renderer.domElement.addEventListener('pointermove',ev=>{if(walking){if(dragLook&&document.pointerLockElement!==renderer.domElement){walkYaw-=(ev.clientX-dragX)*.0021;walkPitch=Math.max(-.72,Math.min(.55,walkPitch-(ev.clientY-dragY)*.0018));dragX=ev.clientX;dragY=ev.clientY;setWalkLook();}tip.style.opacity=0;return;}mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(exitObjects,true);if(hits.length){const obj=hits[0].object;let p=obj;while(p&&!p.userData.exit)p=p.parent;if(p){tip.innerHTML=`<strong>EXIT ${p.userData.exit}</strong>　点击查看出口位置`;tip.style.opacity=1;tip.style.left=ev.clientX+'px';tip.style.top=ev.clientY+'px';return;}}tip.style.opacity=0;});
    renderer.domElement.addEventListener('click',ev=>{if(walking){if(document.pointerLockElement!==renderer.domElement)capturePointer();return;}mouse.x=(ev.clientX/innerWidth)*2-1;mouse.y=-(ev.clientY/innerHeight)*2+1;raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(exitObjects,true);if(!hits.length)return;let p=hits[0].object;while(p&&!p.userData.exit)p=p.parent;if(p){const e=exitsByName.get(p.userData.exit);controls.target.set(e[1]*hallScale,0,e[2]*hallScale);}});
    document.addEventListener('mousemove',ev=>{if(!walking||document.pointerLockElement!==renderer.domElement)return;walkYaw-=ev.movementX*.0021;walkPitch=Math.max(-.72,Math.min(.55,walkPitch-ev.movementY*.0018));setWalkLook();});
    document.addEventListener('pointerlockchange',()=>{if(walking)walkHelp.innerHTML=document.pointerLockElement===renderer.domElement?'W A S D 移动 · 鼠标转向<br>方向键前后/横移 · Q / E 转向<br>Esc 解锁鼠标 · 点「第一视角」返回':'鼠标已解锁 · 点画面可重新捕获<br>W A S D 移动 · Q / E 转向<br>点「第一视角」返回模型视角';});
    document.addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(walking&&['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)){held.add(k);ev.preventDefault();}});
    document.addEventListener('keyup',ev=>held.delete(ev.key.toLowerCase()));
    window.addEventListener('blur',()=>held.clear());
    document.querySelectorAll('.level').forEach(btn=>btn.addEventListener('click',()=>{const v=btn.dataset.level;if(v==='walk'){if(walking){leaveWalk(true);document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b.dataset.level==='b1'));}else{enterWalk();document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b===btn));}return;}if(walking)leaveWalk();document.querySelectorAll('.level').forEach(b=>b.classList.toggle('active',b===btn));if(v==='b1'){level1.visible=true;level2.visible=false;controls.target.set(0,0,0);mapCamera.position.set(0,260,330);mapCamera.zoom=1;}else if(v==='b2'){level1.visible=false;level2.visible=true;controls.target.set(0,-4.6,-1);mapCamera.position.set(29,25,37);mapCamera.zoom=3.8;}else{level1.visible=true;level2.visible=true;controls.target.set(0,-2,0);mapCamera.position.set(440,540,650);mapCamera.zoom=.4;}mapCamera.updateProjectionMatrix();controls.update();}));
    level2.visible=false;
    addEventListener('resize',()=>{const a=innerWidth/innerHeight;mapCamera.left=-cameraViewHeight*a/2;mapCamera.right=cameraViewHeight*a/2;mapCamera.top=cameraViewHeight/2;mapCamera.bottom=-cameraViewHeight/2;mapCamera.updateProjectionMatrix();walkCamera.aspect=a;walkCamera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
    const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(walking)updateWalk(dt);else controls.update();const t=clock.elapsedTime;if(!walking)root.rotation.y=Math.sin(t*.11)*.025;renderer.render(scene,camera);}animate();
  </script>
